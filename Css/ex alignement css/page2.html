<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css ex</title>
    <style>
        img{
            width: 250px;
            height: 250px;
            border-radius: 5px;
            border: 2px solid;
            margin-left: 15px;
            object-fit: cover;
        }
        .all{
            display: flex;
        }
        p{
            font-size: large;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            direction: rtl;
            unicode-bidi: bidi-override;
            line-height: 2;
            text-align: justify;
        } 
    </style>
</head>
<body>
    <div class="all">
     <p>نعم يا صديقي انني اعيش في مدينه هيوستن وانها ثاني اكبر مدينة في الوايا المتحده, من حيث المنكقه انها جيده جدا ومنازلها ليست باهضه الاسعار, ومدارسها تحتوي على٠ ١ نجوم مما يدل انها مدارس ممتازة, وايضا هناك الكثير من المراكز الرياضيه القريبه من المنزل, حيث انك لن تحتاج لسياره لذهاي الى مركز رياضي.</p>
     <img src="29.jpg">
    </div>
</body>
</html>
