<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ex CSS</title>
</head>
<body>
    <!-- Pour box 1 -->
    <div class="box1">
        <p class="title">FUEL STATION</p>
        <p>Locate the nearsest PETRONAS stations to purchase fuel</p>
        <button>ENABLE LOCATION</button>
    </div>

    <!-- Icons et p -->
    <div class="icons"> 

        <!-- icon 1 -->
        <div>
            <div class="imgs">
                <img src="./icons/card.png" alt="card image">
            </div>
        <p>Petrol card</p>
        </div>

         <!-- icon 2 -->
        <div>
            <div class="imgs">
                <img src="./icons/parking.png" alt="parking image">
            </div>
        <p>parking</p>
        </div>

         <!-- icon 3 -->
        <div>
            <div class="imgs">
                <img src="./icons/car-service_18208169.png" alt="car image">
            </div>
        <p>Car service</p>
        </div>

         <!-- icon 4 -->
        <div>
            <div class="imgs">
                <img src="./icons/clothing-store_3486372.png" alt="shop image">
            </div>
        <p>PETRONAS shop</p>
        </div>

         <!-- icon 5 -->
        <div>
            <div class="imgs">
                <img src="./icons/car-service_18208169.png" alt="car service image">
            </div>
        <p>Motor takaful & insurance</p>
        </div>

         <!-- icon 6 -->
        <div>
            <div class="imgs">
                <img src="./icons/charging-station_9138039.png" alt="station image">
            </div>
        <p>EV charging</p>
        </div>

         <!-- icon 7 -->
        <div>
            <div class="imgs">
                <img src="./icons/breakfast_11346906.png" alt="cafe image">
            </div>
        <p>cafe mesra</p>
        </div>
        
         <!-- icon 8 -->
        <div>
            <div class="imgs">
                <img src="./icons/apps_15730358.png" alt="options image">
            </div>
        <p>View all</p>
        </div>

    </div>

    <!-- Background image -->
    <div class="img">
        <h3><span style="color: rgb(238, 238, 2);">RM5</span> cashback</h3>
        <p class="lastp">when you pay with setel at watsons</p>
    </div>
    
</body>
</html>
