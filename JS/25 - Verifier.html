<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifier</title>
    <script>
        function verifier(n)
        {
            var s = 0 , i , b = false;

            for (i = 1; i < n; i++) 
            {
                s = s + i;
            }

            if (s == n)
            {
                b = true;
            }

            return b;
        }
    </script>
</head>
<body>
    <script>
        var n = parseInt(prompt("Donner n :"));

        if (verifier(n))
        {
            document.write("Parfait");
        }
        else
        {
            document.write("N'est pas Parfait");
        }
    </script>
</body>
</html>
