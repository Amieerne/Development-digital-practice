<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<form name="f">
    Nom : <input type="text" name="t1"><br><br>
    Prenom : <input type="text" name="t2"><br><br>
    Email : <input type="text" name="t3"><br><br>
    Telephone : <input type="text" name="t4"><br><br>

    Resultat : <br>
    <textarea name="t5" rows="5" cols="40"></textarea><br><br>

    <input type="button" value="Afficher" onclick="verifier()"><br><br>
    <input type="button" value="Remplacer" onclick="remplacer()"><br><br>
</form>

<script>
function verifier(){

    var t1 = document.f.t1;
    var t2 = document.f.t2;
    var t3 = document.f.t3;
    var t5 = document.f.t5;

    // Nom
    var x = /^[a-h]/i;
    if (x.test(t1.value)){
        alert("Attention: le nom ne doit pas commencer par [a-h]");
    }

    // Email
    var y = t3.value.split('@');
    if (y.length > 2){
        alert("Attention: email contient plus d'un @");
    }

    // Prenom
    var z = /\d/;
    if (z.test(t2.value)){
        alert("Attention: le prenom contient un chiffre");
    }

    // affichage 
     t5.value = "Tu t'appelle : " + t1.value + " " + t2.value + "\n" + 
        "Ton email est : " + t3.value;
}

// remplacer
function remplacer(){
    var t4 = document.f.t4;
    t4.value = t4.value.replace(/\d/g , "*");
}
</script>

</body>
</html>
