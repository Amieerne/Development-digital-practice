<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function calculer(n)
        {
            var i , s = 0;
            for (i=0;i<=n;i++)
            {
                s=parseInt(i)+parseInt(s);
            }
         return s;
        }
       
    </script>
</head>
<body>
    <script>
        var m = parseInt(prompt("Donner M :",""))
        document.write(calculer(m))
    </script>  
</body>
</html>
