<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n=parseInt(prompt("Donner dimension :",""))
        t= new Array(n);
        for (i=0;i<=n;i++)
        {
            k=parseInt(prompt("Donner un element d'indice :"+i,""))
            t[i]=k
        }
        for (i=0;i<=n;i++)
        {
            document.write(t[i])
        }
    </script>
</body>
</html>
