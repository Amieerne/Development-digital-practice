<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max</title>
    <script>
        function max(a,b,c)
        {
            var m ;

            if (a > b && a > c)
            {
                m = a;
            }
            else if (b > a && b > c)
            {
                m = b;
            }
            else
            {
                m = c;
            }

            return m;
        }
    </script>
</head>
<body>
    <script>
        var a = parseInt(prompt("Donner a :"));
        var b = parseInt(prompt("Donner b :"));
        var c = parseInt(prompt("Donner c :"));

        var res = max(a,b,c);

        document.write("Max = " + res);
    </script>
</body>
</html>
