<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function verifier(n)
        {
            var b = false;
            if ( n % 2 == 0)
            {
                b = true;
            }
            return b;
        }
    </script>
</head>
<body>
    <script>
        var m = parseInt(prompt("Donner m :",""))
        var bb = verifier(m);
        if (bb == true)
        {
            document.write("Paire");
        }
        else
        {
            document.write("Impaire");
        }
    </script>
</body>
</html>
