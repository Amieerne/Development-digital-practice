<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x=parseFloat(prompt("Donner un reel :",""))
        v=0;
        if (x>0)
           {
            v=x
        }
        else {
            v=(-1)*x
        }
        document.write(v)
    </script>
</body>
</html>
