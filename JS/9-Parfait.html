<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n=parseInt(prompt("Donner un entier :",""))
        var s=0;
        for (i=1 ; i<n ; i++)
        {
            if (n % i == 0)
            {
                s=s+i
            }
        }
        if (n==s)
        {
            document.write("Parfait")
        }
        else {
            document.write("N'est pas parfait")
        }
    </script>
</body>
</html>
